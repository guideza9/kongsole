# Kong connection registry -- committed to git, no secrets (docs/DESIGN.md
# section 3). Load with `bin/rails kong:load_connections`. Each teammate
# pulls this file and supplies their own credential through the web login;
# nothing here ever authenticates anything by itself.
#
# The local dev/sit values below match docker-compose.yml's two-node Kong CE
# stack, which fronts its own Admin API through the loopback pattern
# (docs/DESIGN.md section 1): rw route on kong-admin.internal, ro route on
# kong-admin-ro.internal, both proxied on localhost:8000. Add these to
# /etc/hosts pointing at 127.0.0.1 to resolve them locally, or edit the
# admin_url values to hit the proxy with an explicit Host header instead.

- name: dev-readwrite
  env: dev
  rank: 0
  # Port 8000 -- the *proxy* port carrying the admin-api-rw route (basic-auth
  # + acl). Port 8001 is Kong's raw, unauthenticated Admin API listener and
  # does not go through the loopback guard at all -- pointing admin_url at
  # it makes every credential probe back as rw, regardless of which Kong
  # consumer you log in as.
  admin_url: http://kong-admin.internal:8000
  apply_mode: direct
  color_tag: green
  verify_ssl: false # local compose stack only; never set false against a real endpoint
  insecure_http: true # local compose stack only -- the one config-file-only escape hatch, docs/DESIGN.md section 3

- name: dev-readonly
  env: dev
  rank: 0
  # Port 8000, not 8001 -- see dev-readwrite above. This is what actually
  # routes through admin-api-ro (GET/HEAD only) instead of bypassing it.
  admin_url: http://kong-admin-ro.internal:8000
  apply_mode: direct
  color_tag: green
  verify_ssl: false # local compose stack only; never set false against a real endpoint
  insecure_http: true # local compose stack only -- the one config-file-only escape hatch, docs/DESIGN.md section 3

- name: sit
  env: sit
  rank: 1
  admin_url: http://localhost:8011
  apply_mode: direct
  color_tag: yellow
  verify_ssl: false
  insecure_http: true

# uat: local stand-in until a real uat Kong + git host exist (PRODUCT.md
# "before M2" -- git host is still undecided). Reuses dev-readonly's ro
# route (same compose stack, proves writes really fail at the Kong layer)
# and a local bare repo seeded by `bin/rails kong:seed_config_repo`, so the
# whole PR-mode pipeline is exercisable end to end without a real host.
- name: uat
  env: uat
  rank: 2
  admin_url: http://kong-admin-ro.internal:8000
  apply_mode: pr
  color_tag: orange
  verify_ssl: false # local compose stack only; never set false against a real endpoint
  insecure_http: true # local compose stack only -- the one config-file-only escape hatch, docs/DESIGN.md section 3
  git_repo: <%= Rails.root.join("storage", "config_repos", "uat.git") %>
  git_branch: main
  git_path: uat/kong.yaml
  select_tags: [managed-by-kongctl]

# prod is illustrative -- point admin_url at prod's *read-only* route once it
# exists (docs/DESIGN.md section 1.3), and set git_repo/git_branch/git_path
# once a real git host is chosen (M2).

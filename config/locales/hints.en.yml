# Every hint in the UI lives here (R3): field help and examples, empty
# states, risk notices, error explanations and page intros. Views read these
# keys only; edit the wording here without touching a view.
#
# "To Edit: " marks wording the owner still has to check -- list them with
# `bin/rails hints:todo`. Do not drop the prefix until the owner has.
#
# Written for someone who knows HTTP and APIs but not Kong or this team's
# habits. Examples are made up (example.internal, payments-api); never put a
# real hostname, tag or credential of the team here.
#
# Layout (the top-level groups are fixed):
#   hints.fields.<form>.<field>.{help,example,detail}
#   hints.empty_states.<page>.{title,body,action}
#   hints.risks.<situation>.{title,body}
#   hints.errors.<key>.{title,cause,next_step}
#   hints.pages.<page>.intro
#   hints.ui.*  -- the few words the hint pieces themselves print
en:
  hints:
    ui:
      example_prefix: "e.g."
      why: "Why"
      next_step: "What to do"
      toggle:
        hide: "Hide detailed hints"
        show: "Show detailed hints"
        hide_short: "Fewer hints"
        show_short: "More hints"

    fields:
      connection:
        project_env_id:
          help: "The environment this Kong node serves. The connection takes its name, rank and apply mode from it."
          example: "payments/dev"
          detail: "Only environments made in Kongsole with no Kong node yet are listed. Environments from config/connections.yml get theirs from that file."
        admin_url:
          help: "Where the Admin API answers, through the route Kong itself guards with basic-auth."
          example: "https://kong-admin.example.internal"
          detail: "https:// is required unless it points at localhost. Do not point it at port 8001: that listener skips the basic-auth route, so every login looks read-write."
        verify_ssl:
          help: "Check the certificate of the Admin API before sending your credential."
          detail: "Leave this on. Turn it off only for a local test stack; a real endpoint with it off will accept anyone pretending to be Kong."
        ca_bundle_path:
          help: "A file of CA certificates to trust when the Admin API uses an internal CA. Leave empty to use the system trust store."
          example: "/etc/ssl/certs/internal-ca.pem"
        credential_mode:
          help: "Where your Kong credential is kept after you log in."
          example: "session"
          detail: "session keeps it only in this browser session and never in the database, so there is no background sync and MCP cannot use it. stored keeps it encrypted in the database, which sync and MCP need."
      project:
        key:
          help: "The short name every connection in the project starts with, as in payments/uat. Lower-case letters, digits and dashes; it cannot change later."
          example: "payments"
        name:
          help: "The name people see on the Connections page and in the header."
          example: "Payments"
        network_note:
          help: "Which network reaches this project's Kong nodes. It is shown under every network error, so say what to join."
          example: "Reachable from the NONPROD VPN only"
        git_repo:
          help: "The decK config repo this project's environments render into. Only PR-mode environments push to it."
          example: "git@git.example.internal:team/payments-kong.git"
        git_branch:
          help: "The branch pull requests are opened against."
          example: "main"
        git_web_url:
          help: "Where a pushed branch can be read in a browser. Optional; {branch} is replaced by the branch name."
          example: "https://git.example.internal/team/payments-kong/tree/{branch}"
      project_env:
        name:
          help: "The environment's name, second half of project/env. dev, sit, uat and prod fix how careful Kongsole is; any other name asks you."
          example: "nonprod"
        position:
          help: "Where it sits in the project's list and in the header switcher. Lower comes first."
          example: "2"
        rank:
          help: "How careful Kongsole is here. 2 and 3 turn the header violet and ask for the connection name and your password before a change is applied."
          detail: "There is no default on purpose: pick the rank of the environment this one behaves like."
        rank_fixed: "Rank %{rank}, fixed for this name."
        apply_mode:
          help: "Whether Kongsole may write to this environment's Kong node. Not set keeps it read only."
          detail: "PR mode, where every change is a reviewed pull request, is set in config/connections.yml by the team, never here."
        color_tag:
          help: "The colour of the environment's chip below rank 2. Leave empty to take it from the rank."
          example: "green"
      login:
        username:
          help: "The Kong consumer name of your Admin API credential."
          example: "alice"
        password:
          help: "The basic-auth password for that consumer. It is kept only for this session unless the connection is set to stored."
        operator:
          help: "Your own name, when the credential is shared by the team. Every change is recorded under it."
          example: "alice.w"
          detail: "Required when the consumer is tagged shared-credential in Kong. It is how the audit log tells people apart when they log in with the same credential."
      token:
        operator:
          help: "Who every change made with this token traces back to in the audit log."
          example: "alice.w"
        name:
          help: "A label so you can tell your tokens apart later. Optional."
          example: "claude code"
        connection_ids:
          help: "The connections this token may reach. Only connections with a stored credential can be picked, because MCP runs without a browser session."
      entity_edit:
        tags:
          help: "Labels on this entity, comma separated. decK and the filters on the list use them."
          example: "payment, core"
          detail: "Keep the select_tags of this connection on the entity, or decK will stop managing it."
        enabled:
          help: "Off keeps the entity in Kong but makes Kong ignore it."
      entity_filter:
        q:
          help: "Shows entities whose name contains this text."
          example: "payments"
        tags:
          help: "Shows entities that carry every one of these tags."
          example: "payment, core"
        sort:
          help: "The order of the list. Updated (newest) shows the latest changes first."
      service:
        name:
          help: "How this service is known in Kong, decK files and routes. Letters, digits and . _ ~ - only."
          example: "billing-api"
        tags:
          help: "Comma-separated labels for finding it later. This environment's own tags are added for you."
          example: "team-payments, billing"
        enabled:
          help: "A disabled service keeps its routes, but Kong answers them with 503 instead of forwarding."
        protocol:
          help: "How Kong talks to the upstream: plain HTTP, HTTPS, or gRPC (with or without TLS)."
        host:
          help: "The upstream's host name or IP as Kong reaches it, or the name of an upstream in Kong."
          example: "billing.internal"
        port:
          help: "Follows the protocol (80, or 443 for https and grpcs) until you change it."
          example: "8080"
        path:
          help: "Optional. Put in front of every request's path before it is forwarded. Starts with /."
          example: "/api"
        retries:
          help: "How many times Kong retries a request the upstream failed to answer. 0 to 32767."
        connect_timeout:
          help: "How long Kong waits to open a connection to the upstream, in milliseconds."
        read_timeout:
          help: "The longest wait between two reads of the upstream's answer, in milliseconds."
        write_timeout:
          help: "The longest wait between two writes of the request to the upstream, in milliseconds."
      route:
        name:
          help: "How this route is known in Kong and in decK files, which need one to place it. Letters, digits and . _ ~ - only."
          example: "billing-v1"
        tags:
          help: "Comma-separated labels for finding it later. This environment's own tags are added for you."
          example: "team-payments"
        methods:
          help: "The HTTP methods it takes. None ticked means every method."
        hosts:
          help: "One per line. Empty means every host. A * may stand for the first or the last part only."
          example: "api.example.com"
        paths:
          help: "One per line, each starting with /. Kong matches the start of the path, so /billing also takes /billing/v2 and /billings. Start with ~ for a regular expression."
          example: "/billing"
        protocols:
          help: "Which requests it takes, by protocol. Most HTTP routes take both http and https."
        strip_path:
          help: "On: the matched path is cut off before forwarding, so /billing/invoices reaches the service as /invoices."
        preserve_host:
          help: "On: the service sees the client's Host header instead of its own host name."
      upstream:
        name:
          help: "The virtual hostname a service points at to use this upstream. Services reach it as http://<name>."
          example: "payments-upstream"
        algorithm:
          help: "How Kong picks a target for each request."
          example: "round-robin"
          detail: "round-robin spreads requests in turn, least-connections favours the least busy target, consistent-hashing keeps the same client on the same target (set hash_on too)."
        hash_on:
          help: "What consistent-hashing groups requests by. Only used with that algorithm."
          example: "header"
        hash_fallback:
          help: "What to hash on when the hash_on value is missing from a request."
          example: "ip"
        slots:
          help: "How many slots the balancer ring has. The default suits most upstreams."
          example: "10000"
        healthchecks:
          help: "Active and passive checks that take unhealthy targets out of rotation."
          detail: "Active checks call a path on each target on a timer. Passive checks watch real traffic for failures. Start from the Active HTTP preset if you are not sure."
        host_header:
          help: "The Host header sent to the targets, when it should differ from the upstream name."
          example: "payments.example.internal"
        tags:
          help: "Labels on this upstream, comma separated in the list, a JSON array here."
          example: "[\"payment\"]"
      target:
        target:
          help: "The host and port of one backend behind this upstream."
          example: "10.0.0.12:8080"
        weight:
          help: "Its share of traffic compared with the other targets. 0 takes it out of rotation."
          example: "100"
        tags:
          help: "Labels on this target, as a JSON array."
          example: "[\"payment\"]"
      certificate:
        cert:
          help: "The PEM certificate, including the chain if the server should send one."
          example: "-----BEGIN CERTIFICATE-----"
        key:
          help: "A vault reference to the private key, never the key itself. Kongsole refuses a pasted PEM key."
          example: "{vault://env/payments-tls-key}"
          detail: "Kong CE only has the env vault: the key sits in an environment variable of the Kong nodes, and this field names it. The variable must exist on every node before the change is applied."
        snis:
          help: "Hostnames this certificate answers for. Each becomes an SNI entity."
          example: "[\"payments.example.internal\"]"
        tags:
          help: "Labels on this certificate, as a JSON array."
          example: "[\"payment\"]"
      ca_certificate:
        cert:
          help: "A PEM CA certificate Kong trusts when it checks client or upstream certificates."
          example: "-----BEGIN CERTIFICATE-----"
        tags:
          help: "Labels on this CA certificate, as a JSON array."
          example: "[\"internal-ca\"]"
      sni:
        name:
          help: "A hostname clients send in TLS. Kong answers with the certificate this SNI belongs to."
          example: "payments.example.internal"
        certificate:
          help: "The certificate that answers for this hostname. Set from the certificate page you came from."
        tags:
          help: "Labels on this SNI, as a JSON array."
          example: "[\"payment\"]"
      consumer:
        username:
          help: "The name of an API client, or of a person using the Admin API."
          example: "reporting-bot"
        custom_id:
          help: "An id from another system, used when you need to match this consumer to it."
          example: "crm-4471"
        tags:
          help: "Labels on this consumer, as a JSON array. shared-credential marks a login used by more than one person."
          example: "[\"shared-credential\"]"
      plugin:
        scope:
          help: "Where the plugin runs: on one service, route or consumer, or on every request when global."
          detail: "The scope comes from the page you started on. A global plugin touches every request through this Kong, including the admin path."
        enabled:
          help: "Off keeps the plugin configured but not running."
        protocols:
          help: "The request protocols the plugin runs on."
          example: "[\"http\", \"https\"]"
        tags:
          help: "Labels on this plugin, as a JSON array."
          example: "[\"payment\"]"

    empty_states:
      connections:
        title: "No projects yet"
        body: "A project groups the environments of one Kong estate, each with its own Kong node. Load the team's projects with bin/rails kong:load_connections, or start a project on this machine."
      # R1.19: a filter on the connections page that matched nothing.
      connections_filtered:
        title: "No project or environment matches this filter"
        body: "Every word has to appear in a project's name or key, or in the name of one of its environments. Try fewer words."
      project_envs:
        title: "No environments in this project yet"
        body: "An environment is one stage of the project, like dev or uat, served by one Kong node. Add the first one, then connect it to its Kong node."
      entities:
        never_synced:
          title: "Nothing synced from this connection yet"
          body: "Kongsole lists what it has read from Kong. Sync once to see the %{type} on this node."
        no_match:
          title: "No %{type} match this filter"
          body: "Clear the filter to see everything, or sync if something was added in Kong since the last sync."
        none:
          title: "No %{type} on this node"
          body: "Kong had none of these at the last sync. Sync again if someone has added some since."
      plugins_catalog:
        title: "No plugins are loaded on this node"
        body: "The list comes from the plugins this Kong node has loaded. If you expected some, log in again so Kongsole reads the node once more."
      # R8.9: a PR-mode connection's changes collect in a changeset.
      changesets:
        title: "Nothing collected yet"
        body: "On a PR-mode environment every change you propose waits in one changeset. Submit it to push one branch for the team to review as one pull request."
      changeset_items:
        title: "Nothing in this changeset yet"
        body: "Changes you propose on %{env} collect here, from the Entities pages or from an agent. Nothing reaches git until you submit."
      change_plans:
        title: "No pull requests proposed yet"
        body: "On a pr connection, every change you review becomes a branch here for the team to review and merge."
      audit_events:
        title: "No changes applied yet"
        body: "Every change applied through Kongsole, by a person or by an agent, is recorded here with who made it."
      tokens:
        title: "No tokens issued yet"
        body: "A token lets an agent such as Claude Code use Kongsole through MCP, as you. Issue one to get started."
      certificates_expiring:
        title: "Nothing expires within %{days} days"
        body: "Certificates are read at each sync. Pick a longer window to look further ahead."
        never_synced:
          title: "Nothing is known about certificates here yet"
          body: "This connection has never synced, so Kongsole has not read its certificates. Sync from the Entities page to check them."
      entity_children:
        routes:
          title: "No routes yet"
          body: "A route decides which requests reach this service."
        plugins:
          title: "No plugins here yet"
          body: "Plugins add behaviour such as auth or rate limiting to this entity."
        targets:
          title: "No targets yet"
          body: "Targets are the backends this upstream spreads traffic across. Without one, requests to it fail."
        snis:
          title: "No SNIs yet"
          body: "An SNI names a hostname this certificate answers for."
        credentials:
          title: "No credentials yet"
          body: "Credentials let this consumer log in through key-auth or basic-auth. Their secrets are never shown here."

    risks:
      route_overlap:
        # One route gets each request, so an overlap means one of them stops
        # getting it. A warning: the change can still go ahead.
        title:
          one: "1 other route takes some of these requests"
          other: "%{count} other routes take some of these requests"
        reasons:
          exact: "Same path"
          prefix: "Path prefix"
          unknown: "Can't tell (regex)"
      delete_entity:
        title: "Deleting removes it from Kong"
        body: "Anything that points at it stops working. Kong refuses to delete a service that still has routes; a deleted consumer loses its credentials, and a deleted upstream its targets."
      delete_admin_path:
        title: "This is the way into the Admin API"
        body: "Deleting it locks everyone out of the Admin API, including Kongsole and CI. Type its name to confirm only if you are rebuilding the admin path on purpose."
      delete_protected:
        title: "This entity is tagged protected"
        body: "The team marked it as something that must not go by accident. Type its name to confirm only if you are sure it should be removed."
      rank_2_login:
        title: "This is %{env}"
        body: "Please take a moment to check you meant to connect here."
        pr_note: "Changes on this connection go through a reviewed pull request."
      shared_credential_write:
        title: "Recorded under %{operator}"
        body: "This credential is shared, so the audit log names the operator you gave at login, not the Kong consumer."
      env_var_certificate:
        title: "The key must already be on every Kong node"
        body: "This certificate reads its private key from an environment variable. If any node lacks it, TLS on that node fails as soon as the change is applied."
      # R1.14: shown instead of the write controls (KongConnection#write_block_reason).
      # The fix differs by where the env is defined: a local env is edited in
      # the UI, a registry env only in config/connections.yml.
      # R8.9: git or Kong moved under a changeset (Kong::ChangesetDrift).
      changeset_drift:
        title: "Something changed since this changeset began"
        body: "The diff below is rendered on the latest config repo and checked against Kong as it is now. Read it again before you submit."
      write_blocked:
        apply_mode_unset:
          title: "Nothing can be written to %{env}"
          body_local: "Its apply mode is not set, so Kongsole only reads here. Set the environment to Direct apply to make changes. PR mode can only be set for an environment listed in config/connections.yml."
          body_registry: "Its apply mode is not set in config/connections.yml, so Kongsole only reads here. Add apply_mode (direct or pr) to this environment in that file, then run bin/rails kong:load_connections."
          action: "Edit environment %{env}"
        read_only:
          title: "This credential can only read %{env}"
          body: "Kong refused a test write from this login, so Kongsole only reads here. To make changes, log in again with a credential that can write."
          action: "Log in to %{env} again"
      # R1.15: the confirm on each Remove in a Connections row.
      remove_connection:
        confirm: "Remove the connection to %{env} from this machine? Any credential saved for it is deleted too. The environment stays, and nothing in Kong changes."
      remove_environment:
        confirm: "Remove the environment %{env}? It has no connection, and nothing in Kong changes."

    # Kong::ErrorExplanation. network_* and connection_failed get the network
    # note of the project appended to next_step (R1).
    errors:
      unauthorized:
        title: "Credential rejected: wrong username or password."
        cause: "The basic-auth plugin in front of the Admin API did not accept this username and password."
        next_step: "Check the username and password for this connection, then log in again."
      forbidden:
        title: "This credential is not allowed here."
        cause: "Kong knows the consumer, but the ACL plugin on the Admin API route does not let its group in."
        next_step: "To Edit: Ask whoever runs this Kong node to add the consumer to the allowed ACL group."
      route_not_matched:
        title: "No Kong route matched this request."
        cause: "The Admin API route did not accept this method or path. A read-only credential sending a write gets this, and so does a wrong admin URL."
        next_step: "If you meant to change something, log in with a read-write credential. Otherwise check the admin URL of this connection."
      entity_not_found:
        title: "Kong has no such entity."
        cause: "The Admin API answered, and the entity is not there. Someone may have deleted it since the last sync."
        next_step: "Sync to refresh the list, then try again."
      rate_limited:
        title: "Too many requests to the Admin API."
        cause: "The rate-limiting plugin on the Admin API route turned this request away."
        next_step: "Wait a minute, then try again."
      upstream_unavailable:
        title: "Kong answered, but its Admin API is down."
        cause: "Kong is reachable, but the service behind the Admin API route did not respond."
        next_step: "To Edit: Tell whoever runs this Kong node. Nothing on this machine will fix it."
      unexpected_response:
        title: "Kong gave an answer Kongsole does not recognise."
        cause: "The Admin API returned a status none of the known cases cover."
        next_step: "Try again. If it keeps happening, note the time and tell whoever runs this Kong node."
      # R8.4: the config repo refused the key or token this machine pushes with.
      git_auth_failed:
        title: "To Edit: The config repo refused this machine's git credential."
        cause: "To Edit: git reached the repo, but the SSH key or token it used was not accepted."
        next_step: "To Edit: Check that this machine's git key or token can read and push to the project's config repo, then try again."
      connection_failed:
        title: "Could not reach this connection."
        cause: "The request never got an answer. This machine may not be on the network of the project."
        next_step: "Check that you are on the right network or VPN, then try again."
      network_dns_failed:
        title: "The Kong hostname does not resolve from this machine."
        cause: "DNS could not find the host in the admin URL. This machine may not be on the network of the project."
        next_step: "Connect to the network or VPN of the project, then try again."
      network_refused:
        title: "The connection was refused."
        cause: "The host answered, but nothing accepted the connection on that port. The port may be wrong, or this machine may not be on the network of the project."
        next_step: "Check the port in the admin URL and your network or VPN, then try again."
      network_timed_out:
        title: "Kong did not answer in time."
        cause: "The request timed out before any answer came back. This machine may not be on the network of the project."
        next_step: "Check your network or VPN, then try again."
      network_tls_failed:
        title: "The TLS handshake with Kong failed."
        cause: "The certificate of the Admin API was not trusted, or TLS could not be set up."
        next_step: "Check the CA bundle path of this connection, or ask whoever runs this Kong node which CA signs it."

    pages:
      connections:
        intro: "Pick an environment to log in to it. Open a project to add environments, connect them to Kong or change them."
        env_without_connection: "No Kong node connected yet."
        # R1.19: the list of projects to log in from.
        project_without_envs: "No environments yet."
        filter_label: "Filter projects and environments"
        filter_placeholder: "e.g. payments uat"
      # R1.20: a project's page, by where the project is defined.
      project_show:
        local: "This project lives on this machine only. Log in to an environment from its row, or connect one to its Kong node."
        registry: "This project comes from config/connections.yml and is shared with the team. Change it there, then run bin/rails kong:load_connections."
      projects_new:
        intro: "A project made here lives on this machine only. Projects the whole team shares come from config/connections.yml."
      projects_edit:
        intro: "Changes here apply to this machine only. The key stays: every connection in the project is named after it."
      project_envs_new:
        intro: "One stage of the project, served by one Kong node. Connect the node once the environment exists."
      project_envs_edit:
        intro: "The connection takes its rank and apply mode from here, on its next save and on every login."
      connections_new:
        intro: "Register a Kong node for this machine. A connection made here is not shared with the team."
      connections_edit:
        intro: "Changes here apply to this machine only."
      connection_show:
        intro: "How Kongsole reaches this Kong node and what it may do there."
      login:
        intro: "Log in with the Kong credential for this node. It is the only login Kongsole has."
      health:
        intro: "The result of the last login to each connection."
      entities_index:
        intro: "What Kongsole last read from this Kong node. Sync to refresh it."
      entity_show:
        intro: "This entity as Kong holds it, with its secrets redacted."
      entities_new:
        intro: "Nothing reaches Kong until you review the change on the next page."
      entities_edit:
        intro: "This proposes a change. Nothing reaches Kong until you review and apply it on the next page."
      plugins_new:
        intro: "Pick a plugin loaded on this node, then set its configuration."
      change_plans_index:
        intro: "Changes proposed on this connection and their pull requests."
      # R8.9
      changesets_index:
        intro: "Each changeset leaves Kongsole as one branch and one pull request."
      changeset_show:
        intro: "What will go into one branch for %{env}, in the order it will be written. Remove what should not go; review the diff before you submit."
        submitted: "Pushed as one branch. Kong does not change until the pull request is approved and merged, and CI syncs it."
      changeset_preview:
        intro: "The config file as it will be pushed, rendered on the latest config repo, with decK's check against Kong and the CI gate. Nothing is pushed until you submit."
      change_plan_show:
        intro: "Check exactly what will change before it reaches Kong."
      audit_events:
        intro: "Every change applied on this connection, and who made it."
      tokens_index:
        intro: "Tokens let an agent use Kongsole through MCP, as you."
      tokens_new:
        intro: "An agent uses it to reach Kongsole through MCP, as you."
      certificates_expiring:
        intro: "Certificates on this connection that expire soon, as of the last sync."
